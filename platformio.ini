; WiFi-CSI Radar
; Environment 1: M5Stack Cardputer ADV
; Environment 2: ESP32-2432S028 / Cheap Yellow Display

[platformio]
default_envs = cardputer-radar-csi


; =============================================================================
; Original project: M5Stack Cardputer ADV
; =============================================================================
[env:cardputer-radar-csi]
platform = espressif32@6.12.0
board = m5stack-stamps3
framework = arduino

board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.flash_mode = qio
board_build.flash_size = 8MB
board_build.partitions = partitions.csv

monitor_speed = 115200
upload_speed = 460800

lib_deps =
    m5stack/M5Unified@^0.2.11
    m5stack/M5Cardputer@^1.1.1

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM=0
    -DARDUINO_M5Stack_StampS3
    -DRADAR_FAKE=0
    -DRADAR_RX_PIN=1
    -DRADAR_TX_PIN=2
    -DRADAR_CSI=1
    -Os

build_src_filter =
    +<main.cpp>
    -<main_cyd.cpp>


; =============================================================================
; ESP32-2432S028 / Cheap Yellow Display
; ESP32 classic + integrated ILI9341 screen + XPT2046 touch
; =============================================================================
[env:esp32-2432s028-csi]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino

board_build.f_cpu = 240000000L
board_build.flash_mode = dio
board_build.flash_size = 4MB

monitor_speed = 115200
upload_speed = 460800

lib_deps =
    bodmer/TFT_eSPI@^2.5.43

build_flags =
    -DRADAR_FAKE=0
    -DRADAR_CSI=1

    -DUSER_SETUP_LOADED=1
    -DILI9341_2_DRIVER=1

    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320

    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=21

    -DTOUCH_CS=33
    -DTOUCH_IRQ=36

    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=16000000
    -DSPI_TOUCH_FREQUENCY=2500000

    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_FONT8=1
    -DLOAD_GFXFF=1

    -Os

build_src_filter =
    -<main.cpp>
    +<main_cyd.cpp>